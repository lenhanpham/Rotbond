name: Release Drafter

# Keeps a draft release up to date from merged PRs (see
# .github/release-drafter.yml for categories and template).
# When cutting a release, publish the draft in the web UI, or copy its
# Highlights into the release created by "Release (Windows)".

# Note: `pull_request` (not `pull_request_target`) is intentional here — it
# matches upstream release-drafter docs and avoids "not a known webhook
# name" annotations. This job never checks out PR code, so it is safe.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    name: Update release draft
    runs-on: ubuntu-24.04
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
